# Log rotation for the relay (it logs to stdout -> systemd journal).
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp journald-freebird.conf /etc/systemd/journald.conf.d/freebird.conf
#   sudo systemctl restart systemd-journald
# Applies to the whole journal: at most 500 MB on disk, nothing older than 1 month,
# one file per week.  The relay writes ~1 line per join/leave plus 1 stats line per minute
# (≈ 2–3 MB per month), so this keeps months of relay history on a 20 GB VPS disk.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=1month
MaxFileSec=1week
